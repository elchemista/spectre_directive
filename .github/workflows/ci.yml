name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ELIXIR_VERSION: "1.19.x"
  OTP_VERSION: "28.x"
  SPECTRE_REF: "af553337b3fb6ff3e28b6ac2c7dda090eece62b2"
  SPECTRE_PATH: ${{ github.workspace }}/.ci/spectre

jobs:
  test:
    name: Test and Credo
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: test
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out Spectre 0.4.1
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre
          ref: ${{ env.SPECTRE_REF }}
          path: .ci/spectre
          persist-credentials: false

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install dependencies
        run: mix deps.get

      - name: Check formatting and compilation
        run: |
          mix format --check-formatted
          mix compile --warnings-as-errors

      - name: Run tests and Activity example
        run: |
          mix test --cover
          mix run examples/agent_server_activity.exs

      - name: Run Credo (non-strict)
        run: mix credo

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      MIX_ENV: dev
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out Spectre 0.4.1
        uses: actions/checkout@v6
        with:
          repository: elchemista/spectre
          ref: ${{ env.SPECTRE_REF }}
          path: .ci/spectre
          persist-credentials: false

      - name: Set up Elixir and Erlang/OTP
        uses: erlef/setup-beam@v1
        with:
          elixir-version: ${{ env.ELIXIR_VERSION }}
          otp-version: ${{ env.OTP_VERSION }}

      - name: Install dependencies
        run: mix deps.get

      - name: Run Dialyzer
        run: mix dialyzer

      - name: Build documentation
        run: mix docs --warnings-as-errors
